<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TuviWear</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* Navbar */

        .navbar {
            background: #111;
            color: white;
            padding: 18px 60px;
            font-size: 28px;
            font-weight: bold;
        }

        /* Container */

        .container {
            width: 90%;
            max-width: 450px;
            margin: 70px auto;
        }

        /* Login Box */

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
        }

        /* Messages */

        .message {
            padding: 12px;
            margin-bottom: 20px;
            background: #eeeeee;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        /* Error */

        .error {
            color: #d00000;
            background: #fff0f0;
            border: 1px solid #ffcccc;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        /* Password */

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        .show-password:hover {
            color: #111;
        }

        /* Login Button */

        .login-btn {
            width: 100%;
            background: #111;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #333;
        }

        /* Register */

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #555;
        }

        .register-link a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .navbar {
                padding: 18px 25px;
                font-size: 24px;
            }

            .container {
                margin: 40px auto;
            }

            .login-box {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- Navbar -->

    <nav class="navbar">
        TuviWear
    </nav>


    <!-- Login Container -->

    <div class="container">

        <div class="login-box">

            <h1>Welcome Back</h1>


            <!-- Django Messages -->

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <!-- Login Error -->

            {% if form.errors %}

                <div class="error">
                    Invalid username or password.
                    Please try again.
                </div>

            {% endif %}


            <!-- Login Form -->

            <form method="POST">

                {% csrf_token %}


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                            id="passwordButton"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- Register -->

            <div class="register-link">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <!-- Show / Hide Password -->

    <script>

        function togglePassword() {

            const passwordInput = document.getElementById("password");
            const passwordButton = document.getElementById("passwordButton");

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                passwordButton.textContent = "Hide";

            } else {

                passwordInput.type = "password";
                passwordButton.textContent = "Show";

            }

        }

    </script>


</body>

</html>
